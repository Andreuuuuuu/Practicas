name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches: [main]  # Se activa con cada push a main
  workflow_dispatch:   # Permite activación manual

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Obtener todo el historial de Git para algunos plugins

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Construir sitio con MkDocs
        run: mkdocs build

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'  # Directorio de salida por defecto de MkDocs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
